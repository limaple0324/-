name: Build V11.7 True Standalone

on:
  push:
    branches:
      - true-v117-windows-build-20260823
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Extract V11.7 source
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force src -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath v117_src_for_windows_build.zip -DestinationPath src -Force
          Get-ChildItem src

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller "numpy<2" opencv-python pywin32 pillow rapidocr_onnxruntime

      - name: Compile source
        working-directory: src
        shell: pwsh
        run: |
          python -m py_compile control_panel.pyw smart_reconnect.py dpi_policy.py window_geometry.py

      - name: Build native standalone EXE
        working-directory: src
        shell: pwsh
        run: |
          pyinstaller --clean --noconfirm AutoReconnect.spec
          if (-not (Test-Path -LiteralPath 'dist\自動重連_V11_7_獨立版.exe')) { throw 'EXE build output missing' }
          Get-Item 'dist\自動重連_V11_7_獨立版.exe' | Format-List Name,Length,LastWriteTime
          Get-FileHash 'dist\自動重連_V11_7_獨立版.exe' -Algorithm SHA256

      - name: Rename delivery EXE
        working-directory: src
        shell: pwsh
        run: |
          Copy-Item -LiteralPath 'dist\自動重連_V11_7_獨立版.exe' -Destination 'dist\自動重連_V11_7_Windows10_真正獨立版.exe' -Force

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: auto-reconnect-v117-windows10-standalone
          path: src/dist/自動重連_V11_7_Windows10_真正獨立版.exe
          if-no-files-found: error
          retention-days: 7
