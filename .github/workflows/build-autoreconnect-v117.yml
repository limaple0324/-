name: Build AutoReconnect V11.7 Standalone

on:
  push:
    branches: [ build-autoreconnect-v117-standalone ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Reconstruct and expand standalone source
        shell: pwsh
        run: |
          $parts = Get-ChildItem 'build/source_parts/part*.b64' | Sort-Object Name
          if (-not $parts) { throw 'No source parts found' }
          $encoded = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw -Encoding ASCII).Trim() }) -join ''
          $bytes = [Convert]::FromBase64String($encoded)
          [IO.File]::WriteAllBytes((Join-Path $PWD 'build/autoreconnect_source_rebuilt.zip'), $bytes)
          $zip = Join-Path $PWD 'build/autoreconnect_source_rebuilt.zip'
          Write-Host "rebuilt zip bytes=$((Get-Item $zip).Length)"
          New-Item -ItemType Directory -Force -Path build_src | Out-Null
          Expand-Archive -LiteralPath $zip -DestinationPath build_src -Force
          Get-ChildItem build_src

      - name: Build true standalone app and installer
        shell: pwsh
        working-directory: build_src
        run: .\build_windows.ps1

      - name: Show bundle self-check
        if: always()
        shell: pwsh
        run: |
          $p = Join-Path $env:TEMP 'AutoReconnect_V11_7_selfcheck.txt'
          if (Test-Path $p) { Get-Content $p }

      - name: Package installed application folder
        shell: pwsh
        run: Compress-Archive -Path build_src\dist\AutoReconnectV117\* -DestinationPath build_src\AutoReconnectV117_portable_folder.zip -Force

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: AutoReconnect-V11.7-True-Standalone-Installer
          path: build_src/installer_out/*.exe
          if-no-files-found: error

      - name: Upload portable folder for verification
        uses: actions/upload-artifact@v4
        with:
          name: AutoReconnect-V11.7-Portable-Folder
          path: build_src/AutoReconnectV117_portable_folder.zip
          if-no-files-found: error
